# fly.toml app configuration file for ZARA Discord Bot
# Reference: https://fly.io/docs/reference/configuration/

app = "zara-discord-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  PYTHONDONTWRITEBYTECODE = "1"

# Discord bots connect via outbound WebSockets and must stay running 24/7 without HTTP sleep
[processes]
  app = "python bot.py"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
  cpu_kind = "shared"
