name: CI/CD Pipeline - Test & Deploy to Oracle Cloud

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ============================================================================
  # STEP 1: CONTINUOUS INTEGRATION (Security & Concurrency Tests)
  # ============================================================================
  test:
    name: Run Security & Regression Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        run: |
          python -m unittest discover tests -v

  # ============================================================================
  # STEP 2: CONTINUOUS DEPLOYMENT (SSH Auto-Deploy to Oracle VM)
  # ============================================================================
  deploy:
    name: Deploy to Oracle Cloud VM
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH and Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: ${{ secrets.ORACLE_SSH_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Navigating to ZARA repository..."
            cd ~/ZARA

            echo "📥 Pulling latest changes from main branch..."
            git pull origin main

            echo "🐳 Rebuilding and starting container..."
            docker compose up -d --build --remove-orphans

            echo "🔍 Checking container status..."
            docker compose ps

            echo "✅ Deployment completed successfully!"
